# Cross-platform build + headless tests. GPU renders need a real device
# and are NOT in CI, except a tiny Lavapipe software-Vulkan smoke render
# on Ubuntu (proves the pipeline end-to-end without hardware).
name: ci

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      # macos-latest DROPPED for now: LunarG's mac download is a GUI
      # installer .app (the old dmg flow is gone; hdiutil fails). The tree
      # is portable (no Win32 API, C++20, Vulkan 1.0, SDL3×CMake), so
      # re-enable once someone verifies a headless Apple-Silicon install.
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ---- Vulkan SDK (Windows/Ubuntu take latest, macOS pins 1.4.350.0
      # ---- to match local; only the build + unit tests run here, never
      # ---- showcase anchors).
      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Runners carry no preinstalled SDK: choco it (latest is fine;
          # CI builds + tests, never showcase anchors).
          if (-not $env:VULKAN_SDK) {
            choco install vulkan-sdk -y --no-progress
            $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
            if (-not $sdk) { Write-Error 'choco vulkan-sdk installed nothing'; exit 1 }
            echo "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
            $env:VULKAN_SDK = $sdk
          }
          & "$env:VULKAN_SDK/Bin/glslc.exe" --version

      - name: Install Vulkan SDK (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Ubuntu archive only (no LunarG repo: version title claims and
          # meta-package names drift; CI builds + tests, never anchors).
          # glslc = shaderc binary pkg; libvulkan-dev = headers + loader.
          sudo apt-get update -qq
          sudo apt-get install -y glslc libvulkan-dev mesa-vulkan-drivers
          # SDL3 static-build system deps (X11/Wayland/audio/udev; xtst
          # missing killed the first green run: SDL errors loud, add here).
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxinerama-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libpipewire-0.3-dev libpulse-dev \
            libasound2-dev libudev-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      # ---- Software-Vulkan smoke & parity gate: Lavapipe has no discrete GPU,
      # ---- but verifies the full dispatch path and enforces cross-backend parity.
      - name: Lavapipe smoke & parity gate (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./build/rt_gpu --list-scenes
          # 1. Deterministic fixed-RNG parity gate (asserts arithmetic exactness without MC noise)
          ./build/raytracer --scene default --width 64 --height 36 --spp 4 --fixed-rng /tmp/cpu_fixed.ppm
          ./build/rt_gpu build/shaders/path.spv /tmp/gpu_fixed.ppm --scene default --width 64 --height 36 --spp 4 --fixed-rng
          ./build/rt_view /tmp/cpu_fixed.ppm --diff /tmp/gpu_fixed.ppm --stats > /tmp/diff_fixed.txt
          cat /tmp/diff_fixed.txt
          python3 -c "
          import re, sys
          txt = open('/tmp/diff_fixed.txt').read()
          m = re.search(r'diff mean=([\d\.]+) max=(\d+) over8=([\d\.]+)%', txt)
          if not m: sys.exit('Could not parse rt_view output')
          mean, mx, over8 = float(m.group(1)), int(m.group(2)), float(m.group(3))
          print(f'Fixed-RNG check: mean={mean}, max={mx}, over8={over8}%')
          if mean > 0.05 or over8 > 0.1:
              sys.exit(f'FAIL: Fixed-RNG drift exceeded threshold: mean={mean} (max 0.05), over8={over8}% (max 0.1%)')
          "

          # 2. Comprehensive estimator drift harness across modes and depths
          python3 tools/parity.py --fast --tolerance-factor 1.5
